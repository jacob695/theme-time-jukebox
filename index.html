<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- YouTube embeds need to see this page's address (otherwise: "Error 153"). -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Theme Time Jukebox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   THEME TIME JUKEBOX
   Layout: a walnut-and-chrome cabinet (player, readout, tuning dial,
   keypad) stands on the left; the title-strip rack scrolls on the right.
   On a phone the cabinet sits on top and a mini bar keeps the controls.
   One deliberate look: a dark room lit by the jukebox.
   =================================================================== */
:root{
  color-scheme: dark;
  --room:#0e0b09;        /* the dark room */
  --room-2:#16110d;
  --walnut:#3b2316;      /* cabinet wood */
  --walnut-2:#5b3621;
  --walnut-hi:#7a4a2c;
  --chrome:#dcd6cc;      /* bright metal */
  --chrome-2:#9e978c;
  --chrome-dk:#4a4540;
  --glow:#ffb547;        /* amber tube glow */
  --glow-2:#ffd58f;
  --glow-dim:rgba(255,181,71,.16);
  --strip:#efe5cf;       /* title-strip card */
  --strip-2:#e2d5b8;
  --ink:#2b1d14;         /* typewriter ink */
  --ink-red:#a8261d;     /* strip stripe, red ink */
  --tube-a:#e2452f; --tube-b:#f2a12c; --tube-c:#38a37a;
  --text:#efe4d2; --muted:#ab9d8a; --faint:#76695a;
  --danger:#ff7a63; --ok:#7fc79d;

  --f-display:"Limelight", "Rockwell", Georgia, serif;
  --f-strip:"Courier Prime", "Courier New", Courier, monospace;
  --f-label:"Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-led:"VT323", "Courier New", monospace;

  --bar-h:0px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--room);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 520px at 22% 8%, rgba(255,181,71,.10), transparent 70%),
             radial-gradient(700px 600px at 90% 100%, rgba(226,69,47,.06), transparent 70%)}
a{color:var(--glow-2)} a:hover{color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
::selection{background:var(--glow);color:#1a1006}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.icon{width:16px;height:16px;fill:currentColor;flex-shrink:0}
.icon-lg{width:22px;height:22px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
code{font-family:var(--f-strip);font-size:.92em;background:rgba(0,0,0,.35);padding:1px 5px;border-radius:3px}

.layout{position:relative;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:28px;
  padding-block:22px 40px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}

/* ---------------- cabinet ---------------- */
.cabinet{position:sticky;top:calc(14px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 28px);overflow:auto;scrollbar-width:none;
  border-radius:200px 200px 22px 22px;padding:22px 20px 22px;
  background:
    linear-gradient(90deg, rgba(0,0,0,.35), transparent 14%, transparent 86%, rgba(0,0,0,.35)),
    repeating-linear-gradient(92deg, var(--walnut) 0 7px, #42271a 7px 9px, var(--walnut) 9px 15px, #352014 15px 16px),
    var(--walnut);
  box-shadow:0 0 0 3px var(--chrome-dk), 0 0 0 5px var(--chrome-2), 0 30px 80px rgba(0,0,0,.7), inset 0 2px 0 rgba(255,255,255,.08);
}
.cabinet::-webkit-scrollbar{display:none}
.arch{display:grid;grid-template-columns:22px minmax(0,1fr) 22px;gap:12px;align-items:stretch}
.tube{border-radius:12px;position:relative;overflow:hidden;min-height:170px;
  background:linear-gradient(180deg,var(--tube-a),var(--tube-b) 50%,var(--tube-c));box-shadow:0 0 18px rgba(242,161,44,.45), inset 0 0 0 2px rgba(255,255,255,.18)}
.tube::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.35),transparent 40%,transparent 70%,rgba(0,0,0,.25))}
.tube i{position:absolute;inset:0;background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.75) 0 2.5px,transparent 3.5px),radial-gradient(circle at 35% 50%,rgba(255,255,255,.6) 0 1.8px,transparent 2.8px);
  background-size:22px 38px,22px 61px;animation:bubble 3.2s linear infinite}
.tube-r i{animation-duration:2.6s;animation-delay:-1.2s}
@keyframes bubble{from{background-position:0 0,0 0}to{background-position:0 -38px,0 -122px}}
.marquee{text-align:center;padding:40px 10px 14px;border-radius:150px 150px 10px 10px;position:relative;
  background:radial-gradient(120% 90% at 50% 0%, #3a2414, #1c120b 70%);box-shadow:inset 0 0 0 2px var(--chrome-2), inset 0 0 30px rgba(255,181,71,.18)}
.mq-kicker{font-family:var(--f-label);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--glow-2);opacity:.85}
.mq-title{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,3.2vw,40px);line-height:.98;margin:8px 0 6px;color:var(--glow-2);
  text-shadow:0 0 12px rgba(255,181,71,.65),0 0 2px #fff;letter-spacing:.02em;text-wrap:balance}
.mq-host{font-family:var(--f-label);font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--chrome)}
.mq-sub{font-family:var(--f-strip);font-style:italic;font-size:11.5px;color:var(--muted);margin-top:6px}

.screen{margin-top:16px;padding:10px;border-radius:14px;background:linear-gradient(180deg,#bdb6ab,#6f6961);box-shadow:inset 0 1px 0 #fff, 0 6px 16px rgba(0,0,0,.5)}
.vp-frame{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;background:#000}
.vp-frame>iframe,.vp-frame>#yt-player{position:absolute;inset:0;width:100%;height:100%;border:0}
.vp-idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px;
  background:radial-gradient(80% 70% at 50% 40%,#2a1b10,#0b0705);color:var(--glow-2)}
.vp-idle b{font-family:var(--f-display);font-weight:400;font-size:20px;text-shadow:0 0 10px rgba(255,181,71,.5)}
.vp-idle span{font-family:var(--f-strip);font-size:12.5px;color:var(--muted);max-width:30ch}
.vp-blocked{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:14px 16px;background:#140e0a;font-size:13px;overflow:auto}
.vp-blocked b{font-family:var(--f-label);font-size:17px;letter-spacing:.04em;color:var(--glow-2)}
.screen.big{position:fixed;z-index:80;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(1100px,94vw);margin:0}
.big-backdrop{position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.8)}

/* amber readout */
.readout{margin-top:16px;border-radius:8px;padding:10px 14px;background:#120a04;box-shadow:inset 0 0 0 2px #2a1a0c, inset 0 0 24px rgba(255,181,71,.12);
  font-family:var(--f-led);color:var(--glow);text-shadow:0 0 6px rgba(255,181,71,.7);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;min-height:86px}
.ro-code{font-size:52px;line-height:.9;letter-spacing:.04em;grid-row:span 3}
.ro-title{font-size:26px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro-meta{font-size:18px;color:#d99a3c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro-song{font-size:18px;color:var(--glow-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro-entry{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}

/* tuning dial */
.dial{margin-top:14px;position:relative;height:58px;border-radius:6px;cursor:pointer;touch-action:none;
  background:linear-gradient(180deg,#f4e7c6,#d8c49a);box-shadow:inset 0 0 0 2px #8a7a5c, inset 0 6px 14px rgba(0,0,0,.18), 0 0 18px rgba(255,181,71,.18)}
.dial.off{cursor:default;filter:saturate(.4) brightness(.65)}
.dial-scale{position:absolute;left:14px;right:14px;top:6px;bottom:6px}
.dial-scale .tk{position:absolute;bottom:18px;width:1px;background:#4a3a28;height:7px}
.dial-scale .tk.maj{height:13px;width:2px}
.dial-scale .lb{position:absolute;bottom:2px;transform:translateX(-50%);font-family:var(--f-label);font-weight:600;font-size:11px;color:#4a3a28;font-variant-numeric:tabular-nums}
.dial-scale .ch{position:absolute;top:2px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--ink-red);opacity:.75}
.dial-scale .ch:hover{opacity:1;transform:scale(1.3)}
.dial-needle{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--ink-red);box-shadow:0 0 6px rgba(168,38,29,.7);transition:left .45s linear}
.dial-band{position:absolute;right:14px;top:4px;font-family:var(--f-label);font-size:10px;letter-spacing:.2em;color:#7a6648;text-transform:uppercase}
.dial-time{display:flex;justify-content:space-between;font-family:var(--f-led);font-size:18px;color:var(--chrome);margin-top:4px;font-variant-numeric:tabular-nums}

/* transport keys */
.transport{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.key{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 4px 7px;border:0;border-radius:5px 5px 9px 9px;cursor:pointer;
  background:linear-gradient(180deg,#f2eee7,#bdb6ab 70%,#958e84);color:#2a241e;box-shadow:0 4px 0 #57514a, 0 6px 10px rgba(0,0,0,.4);
  font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;transition:transform .06s, box-shadow .06s}
.key:active,.key.down{transform:translateY(3px);box-shadow:0 1px 0 #57514a, 0 2px 4px rgba(0,0,0,.4)}
.key.lit{background:linear-gradient(180deg,#ffe2a8,#f0b04a 70%,#c9862b);color:#3a1f05;box-shadow:0 4px 0 #7a4d17, 0 0 16px rgba(255,181,71,.55)}
.key:disabled{opacity:.45;cursor:not-allowed}
.key .icon{width:18px;height:18px}

/* selector keypad */
.keypad{margin-top:16px;padding:12px;border-radius:10px;background:linear-gradient(180deg,#2a1a10,#1b110b);box-shadow:inset 0 0 0 2px var(--chrome-dk)}
.kp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.kp-head span{font-family:var(--f-label);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--chrome-2)}
.kp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kp{border:0;border-radius:50%;aspect-ratio:1;max-width:100%;cursor:pointer;font-family:var(--f-label);font-weight:700;font-size:18px;color:#2a241e;
  background:radial-gradient(circle at 35% 30%,#fff,#cfc8bd 55%,#8f887e);box-shadow:0 3px 0 #4a4540, 0 5px 8px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.kp small{font-size:9px;letter-spacing:.08em;color:#5c544b;margin-top:2px}
.kp:active{transform:translateY(2px);box-shadow:0 1px 0 #4a4540}
.kp.letter{background:radial-gradient(circle at 35% 30%,#ffb6a8,#d4483a 55%,#8a2219);color:#fff}
.kp.letter small{color:#ffd9d2}
.kp.letter.on{box-shadow:0 0 0 3px var(--glow), 0 3px 0 #4a4540}
.kp.go{background:radial-gradient(circle at 35% 30%,#ffe7b5,#f0a636 55%,#a8661a);color:#3a1f05;font-size:12px;letter-spacing:.1em}
.kp.clr{font-size:12px;letter-spacing:.1em}
.grille{margin-top:16px;height:44px;border-radius:8px;background:repeating-linear-gradient(90deg,#1a0f09 0 5px,#5c3a22 5px 7px);box-shadow:inset 0 0 0 2px var(--chrome-dk)}

/* ---------------- rack ---------------- */
.rack{min-width:0}
.rack-head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.eyebrow{font-family:var(--f-label);font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--glow)}
.rack-title{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.05;margin:4px 0 4px;text-wrap:balance}
.rack-sub{color:var(--muted);margin:0;max-width:60ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid #5a4636;background:#21170f;color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;
  font-family:var(--f-label);font-weight:600;font-size:15px;letter-spacing:.04em;white-space:nowrap;transition:border-color .15s,color .15s,background .15s;text-decoration:none}
.btn:hover{border-color:var(--glow);color:var(--glow-2)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-glow{background:var(--glow);border-color:var(--glow);color:#2a1505}
.btn-glow:hover{background:var(--glow-2);border-color:var(--glow-2);color:#2a1505}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:#21170f;border-color:#5a4636}
.btn-sm{padding:5px 11px;font-size:13.5px}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:50%}
.btn-danger:hover{border-color:var(--danger);color:var(--danger)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid #4a3a2c;background:transparent;color:var(--muted);border-radius:6px;padding:7px 12px;cursor:pointer;display:flex;align-items:baseline;gap:8px;
  font-family:var(--f-label);font-weight:600;font-size:15px;letter-spacing:.04em}
.tab b{font-family:var(--f-strip);font-weight:700;color:var(--ink-red);background:var(--strip);border-radius:3px;padding:0 5px;font-size:13px}
.tab .n{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.tab:hover{color:var(--text);border-color:#7a5c40}
.tab.on{background:#2c1d12;color:var(--glow-2);border-color:var(--glow)}
.filters{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1 1 240px;min-width:0;max-width:420px}
.search .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);fill:var(--muted)}
.input,.textarea,.select{width:100%;background:#140e0a;border:1px solid #4a3a2c;border-radius:8px;padding:9px 11px;color:var(--text)}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--glow)}
.search .input{padding-left:34px}
.textarea{font-family:var(--f-strip);font-size:13px;line-height:1.5;resize:vertical;min-height:90px}
.check{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-label);font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;user-select:none}
.check input{accent-color:var(--glow);width:16px;height:16px}
.meta-line{font-family:var(--f-label);font-size:14px;letter-spacing:.04em;color:var(--muted);margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.otd{display:inline-flex;align-items:center;gap:8px;color:var(--glow-2);cursor:pointer;background:none;border:0;padding:0;font:inherit}
.otd b{font-family:var(--f-strip);color:var(--ink-red);background:var(--strip);border-radius:3px;padding:0 5px}

/* title strips */
.strips{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.strip{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:stretch;min-height:76px;border-radius:3px;overflow:hidden;cursor:pointer;
  background:linear-gradient(180deg,var(--strip),var(--strip-2));color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.4), 0 8px 18px rgba(0,0,0,.35);
  border-top:5px solid var(--ink-red);border-bottom:5px solid var(--ink-red);transition:transform .15s, box-shadow .15s}
.strip:hover{transform:translateY(-2px);box-shadow:0 2px 0 rgba(0,0,0,.4), 0 14px 24px rgba(0,0,0,.45)}
.strip.playing{box-shadow:0 0 0 3px var(--glow), 0 0 26px rgba(255,181,71,.55)}
.strip .code{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px dashed rgba(168,38,29,.45);font-family:var(--f-strip);font-weight:700;color:var(--ink-red);line-height:1}
.strip .code .l{font-size:14px}
.strip .code .d{font-size:24px}
.strip .body{padding:8px 10px 8px 12px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.strip .t{font-family:var(--f-strip);font-weight:700;font-size:16.5px;line-height:1.12;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.strip .m{font-family:var(--f-strip);font-size:12px;color:#6a5747;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .side{display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:5px 6px}
.strip .side button{background:none;border:0;padding:3px;cursor:pointer;color:#8a735e;border-radius:4px;display:flex}
.strip .side button:hover{color:var(--ink-red);background:rgba(168,38,29,.08)}
.strip .side .fav.on{color:var(--ink-red)}
.strip .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--ink-red);opacity:.6}
.strip.empty{background:repeating-linear-gradient(135deg,#d9cfb9 0 8px,#d1c6ae 8px 16px);color:#6f5f50;border-color:#8e7c6a}
.strip.empty .code{color:#8e7c6a;border-color:rgba(110,90,70,.4)}
.strip.empty .t{color:#6f5f50}
.stamp{display:inline-block;font-family:var(--f-label);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7b6a5a;border:1.5px solid #9b8873;border-radius:3px;padding:0 5px;transform:rotate(-2deg);align-self:flex-start}
.stamp.dead{color:var(--ink-red);border-color:var(--ink-red)}
.stamp.special{color:#2e6b52;border-color:#2e6b52}
.empty-rack{border:1px dashed #5a4636;border-radius:10px;padding:30px 20px;text-align:center;color:var(--muted)}
.empty-rack b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--text);margin-bottom:6px}

.loadup{border:1px solid rgba(255,181,71,.45);background:linear-gradient(110deg,rgba(255,181,71,.12),rgba(255,181,71,.02) 65%),#1a120c;border-radius:12px;padding:18px 20px;margin-bottom:20px}
.loadup h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 4px}
.loadup-ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.way{background:rgba(0,0,0,.25);border:1px solid #4a3a2c;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.way b{font-family:var(--f-label);font-size:16px;letter-spacing:.03em;color:var(--glow-2)}
.way p{margin:0;font-size:13.5px;color:var(--muted);flex:1}

/* ---------------- modals ---------------- */
.modal-root{position:fixed;inset:0;z-index:90;display:none}
.modal-root.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(5,3,2,.78);backdrop-filter:blur(2px)}
.modal{position:absolute;left:50%;top:calc(30px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(820px,calc(100vw - 24px));
  max-height:calc(100vh - 60px - var(--bar-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--room-2);border:1px solid #4a3a2c;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal-close{position:sticky;top:10px;float:right;margin:10px 10px 0 0;z-index:3;background:rgba(0,0,0,.6)}
.liner-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:24px 26px 18px;border-bottom:1px solid #3a2c20}
.big-strip{width:132px;border-radius:3px;background:linear-gradient(180deg,var(--strip),var(--strip-2));border-top:6px solid var(--ink-red);border-bottom:6px solid var(--ink-red);
  color:var(--ink-red);font-family:var(--f-strip);font-weight:700;text-align:center;padding:14px 6px;line-height:1}
.big-strip .l{font-size:18px} .big-strip .d{font-size:52px}

<script>
'use strict';
/* =====================================================================
   THEME TIME JUKEBOX — every episode of Bob Dylan's Theme Time Radio
   Hour on one jukebox. State: localStorage. Playback: the YouTube
   IFrame Player API (embeds only; nothing is downloaded).
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. Utilities
   --------------------------------------------------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = 'id') => `${p}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const clone = v => JSON.parse(JSON.stringify(v));
const icon = (n, c = 'icon') => `<svg class="${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const IS_FILE = location.protocol === 'file:';
const VIDEO_ID_RE = /^[A-Za-z0-9_-]{11}$/;
const DAY_MS = 864e5;

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
function fmtDate(iso) { const [y, m, d] = iso.split('-').map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; }
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function shuffleArray(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function thumbUrl(id, size = 'mqdefault') { return `https://i.ytimg.com/vi/${id}/${size}.jpg`; }
function decodeEntities(s) { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }
function toast(msg, kind = 'info', ms = 4800) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'error' ? ' error' : '');
  el.innerHTML = msg; // callers pass escaped/trusted strings
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, ms);
}

/* ---------------------------------------------------------------------
   2. The catalogue — all 102 shows. Titles and air dates follow the
      Wikipedia season pages and the show's own archive numbering.
      Codes: A = Season One, B = Season Two, C = Season Three, D = encores.
      Extra search words help match YouTube titles ("|" separated).
   --------------------------------------------------------------------- */
const S1 = ['Weather|rain|sunshine', 'Mothers|mother|mama', 'Drinking|drink|booze', 'Baseball', 'Coffee', 'Jail|prison', 'Fathers|father|daddy',
  'Weddings|wedding|marriage', 'Divorce', 'Summer', 'Flowers', 'Cars|car|automobile', 'Rich Man, Poor Man|rich man poor man|rich and poor', 'Devil|the devil',
  'Eyes', 'Dogs', 'Friends and Neighbors|friends neighbours|friends & neighbors', 'Radio', 'The Bible|bible', 'Musical Map', 'School', 'Telephone|phone',
  'Water', 'Time', 'Guns|gun', 'Halloween', 'Dance|dancing', 'Sleep', 'Food', 'Thanksgiving Leftovers|thanksgiving|leftovers', 'Tennessee', 'Moon',
  'Countdown', "Christmas and New Year's|christmas|new year", "Women's Names|womens names", 'Hair', 'Musical Instruments|instruments', 'Luck|lucky',
  'Tears|crying', 'Laughter|laughing|laugh', 'Heart', 'Shoes', 'Colors|colours', 'Texas', 'Trains|train', 'More Trains', 'Fools|fool|april fools',

/** Title and channel without a key (YouTube oEmbed, then noembed as a fallback). */

/* ---------------------------------------------------------------------
   8. Filling the jukebox: sweeps, per-show searches, playlists, pasted links
   --------------------------------------------------------------------- */
let AUTO = { running: false, stop: false, done: 0, total: 0, attached: 0, label: '' };
let unmatched = [];              // uploads that look like the show but couldn't be placed (session only)
let epSearch = { id: null, busy: false, suggestions: [] };
const SWEEPS = ['Theme Time Radio Hour', 'Theme Time Radio Hour full episode', 'Bob Dylan Theme Time Radio Hour episode', 'TTRH Bob Dylan'];

/** Place a batch of uploads. Confident matches attach; near-misses go to the review list. */
function placeVideos(vids, { auto = true } = {}) {
  let attached = 0, review = 0;
  for (const v of vids) {
    if (lib.auto.rejected[v.id] || epByVideo(v.id)) continue;
    const m = matchVideo(v);
    if (!m) continue;
    if (m.ok) attached += attachVideos(m.ep, [v], { auto });
    else if (!unmatched.some(u => u.v.id === v.id)) { unmatched.push({ v, guess: m.ep.id }); review++; }
  }
  return { attached, review };
}
function episodeQuery(ep) { return `"Theme Time Radio Hour" ${ep.title.replace(/, Part (\d)/, ' part $1')}`; }

async function searchForEpisode(ep) {
  const q = episodeQuery(ep);
  const { videos } = await ytSearch(q);
  lib.auto.queries[q] = Date.now();
  const before = sourcesOf(ep).length;
  placeVideos(videos);
  const fresh = videos.filter(v => !lib.auto.rejected[v.id] && !epByVideo(v.id) && SHOW_RE.test(v.title + ' ' + v.channel) && (!v.duration || v.duration >= 900));
  return { attached: sourcesOf(ep).length - before, suggestions: fresh.slice(0, 6) };
}
async function runAutoSearch({ manual = false } = {}) {
  if (AUTO.running) return;
  if (!lib.settings.ytApiKey) { if (manual) toast('Add a YouTube API key in the service panel first.', 'error'); return; }
  const now = Date.now(), plan = [];
  for (const q of SWEEPS) {
    for (let p = 0; p < 3; p++) { const key = `${q}#${p}`; if (now - (lib.auto.queries[key] || 0) > 30 * DAY_MS) plan.push({ kind: 'sweep', q, p, key }); }
  }
  for (const ep of EPISODES) {
    if (playableSource(ep)) continue;
    if (now - (lib.auto.queries[episodeQuery(ep)] || 0) > 14 * DAY_MS) plan.push({ kind: 'ep', ep });
  }
  const tasks = plan.slice(0, lib.auto.perRun);
  if (!tasks.length) {
    lib.auto.lastRun = now; saveLibrary();
    if (manual) toast('Everything has been searched recently. New searches open up as the 14- and 30-day windows pass.');
    return;
  }
  AUTO = { running: true, stop: false, done: 0, total: tasks.length, attached: 0, label: '' };
  renderAutoStatus();
  const tokens = {}; let ending = '';
  for (const t of tasks) {
    if (AUTO.stop) { ending = 'Stopped.'; break; }
    try {
      if (t.kind === 'sweep') {
        AUTO.label = `Sweeping “${t.q}”, page ${t.p + 1}`; renderAutoStatus();
        if (t.p > 0 && !tokens[t.q]) { lib.auto.queries[t.key] = now; AUTO.done++; continue; } // no further pages
        const r = await ytSearch(t.q, { pageToken: t.p ? tokens[t.q] : '', long: true });
        tokens[t.q] = r.next;
        lib.auto.queries[t.key] = Date.now();
        AUTO.attached += placeVideos(r.videos).attached;
      } else {
        AUTO.label = `${epLabel(t.ep)}`; renderAutoStatus();
        if (playableSource(t.ep)) { AUTO.done++; continue; } // a sweep already found it
        AUTO.attached += (await searchForEpisode(t.ep)).attached;
      }
      saveLibrary();
    } catch (e) {
      ending = e instanceof QuotaError ? 'The free daily YouTube quota is used up. The search picks up again tomorrow.' : `Search stopped: ${esc(e.message)}`;
      break;
    }
    AUTO.done++; renderAutoStatus();
    if (AUTO.done % 3 === 0) refresh();
  }
  AUTO.running = false;
  if (AUTO.done || /quota/.test(ending)) lib.auto.lastRun = Date.now();
  lib.auto.lastSummary = `${new Date().toLocaleString()}: ran ${AUTO.done} of ${AUTO.total} searches, loaded ${AUTO.attached} upload${AUTO.attached === 1 ? '' : 's'}.${ending ? ' ' + ending.replace(/<[^>]+>/g, '') : ''}`;
  saveLibrary(); renderAutoStatus(); refresh();
  toast(`YouTube search loaded ${AUTO.attached} upload${AUTO.attached === 1 ? '' : 's'}. ${loadedCount()} of ${EPISODES.length} shows are on the jukebox.${unmatched.length ? ` ${unmatched.length} to review in the service panel.` : ''}${ending && !/Stopped/.test(ending) ? ' ' + ending : ''}`,
    ending && !/Stopped/.test(ending) ? 'error' : 'info', 9000);
}
async function searchOne(ep) {
  if (!lib.settings.ytApiKey) return;
  epSearch = { id: ep.id, busy: true, suggestions: [] };
  if (detailId === ep.id) renderDetail();
  try {
    const r = await searchForEpisode(ep);
    epSearch.suggestions = r.suggestions;
    saveLibrary();

      : r.suggestions.length ? 'No sure match. The closest uploads are listed under Records.' : 'YouTube has nothing that looks like this show right now.');
  } catch (e) {

}
async function importPlaylist(input) {

async function bulkPaste(text) {

  }

  toast(`${attached} loaded onto strips${review ? `, ${review} to place by hand below` : ''}${already ? `, ${already} already on the jukebox` : ''}.`, 'info', 8000);

/* ---------------------------------------------------------------------
   9. Player — YouTube IFrame API, loaded on first play
   --------------------------------------------------------------------- */
const P = { api: 'idle', yt: null, ready: false, playing: false, duration: 0, time: 0, tick: null, lastSave: 0, pendingStart: 0, big: false, seeking: false };

}

}
function showEmbedBlocked() {

  el.innerHTML = `<b>YouTube won't play it here (error 153)</b>
    <span class="muted">${IS_FILE ? 'This page was opened straight from a file, so YouTube can\'t tell where the player lives. The red box at the top has the one-minute fix.'
      : 'YouTube can\'t see this page\'s web address. Open the jukebox in a normal browser tab from <code>http://localhost</code> or a website.'}</span>
    <span class="flex wrap gap"><a class="btn btn-glow btn-sm" href="https://www.youtube.com/watch?v=${esc(it.videoId)}${t ? '&t=' + t + 's' : ''}" target="_blank" rel="noopener">${icon('yt')}Watch on YouTube</a>
    ${IS_FILE ? '<button class="btn btn-sm" data-action="show-file-help">How to fix</button>' : ''}</span>`;

/* ---- resume points: one per show + upload ---- */

/* ---- queue ---- */
function makeItem(ep, src, startAt = 0) { return { qid: uid('q'), epId: ep.id, videoId: src.videoId, startAt }; }

  const start = startAt == null ? resumePoint(ep.id, src.videoId) : startAt;

async function checkLinks() {
  const ids = [...new Set(EPISODES.flatMap(e => sourcesOf(e).map(s => s.videoId)))];
  if (!ids.length) { toast('No records loaded yet, so there is nothing to check.'); return; }
  let done = 0, dead = 0, revived = 0, unknown = 0;
  const check = id => new Promise(res => {
    const img = new Image();
    const tm = setTimeout(() => { img.onload = img.onerror = null; res('unknown'); }, 12000);
    img.onload = () => { clearTimeout(tm); res(img.naturalWidth === 120 && img.naturalHeight === 90 ? 'dead' : 'ok'); };
    img.onerror = () => { clearTimeout(tm); res('unknown'); };
    img.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg?t=${Date.now()}`;
  });
  const queue = ids.slice();
  const worker = async () => {
    while (queue.length) {
      const id = queue.shift(), r = await check(id);
      if (r === 'dead') { if (!lib.deadLinks[id]) dead++; lib.deadLinks[id] = true; }
      else if (r === 'ok') { if (lib.deadLinks[id]) { revived++; delete lib.deadLinks[id]; } }
      else unknown++;
      done++; const p = $('#link-progress'); if (p) p.textContent = `Checked ${done} of ${ids.length}…`;
    }
  };
  await Promise.all(Array.from({ length: Math.min(6, ids.length) }, worker));
  saveLibrary();
  const msg = `Checked ${ids.length} upload${ids.length === 1 ? '' : 's'}: ${dead} newly dead, ${revived} back online${unknown ? `, ${unknown} couldn't be reached` : ''}.`;
  refresh(); const p = $('#link-progress'); if (p) p.textContent = msg;
  toast(msg, dead ? 'error' : 'info', 7000);
}
function exportLibrary() {
  const data = { app: 'theme-time-jukebox', version: 1, exportedAt: new Date().toISOString(),
    sources: lib.sources, favorites: lib.favorites, notes: lib.notes, resume: lib.resume, deadLinks: lib.deadLinks,
    auto: { ...lib.auto } }; // the API key is never exported
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `theme-time-jukebox-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Library exported. Keep that file somewhere safe.');
}
function importLibrary(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let raw; try { raw = JSON.parse(reader.result); } catch { toast('That file isn\'t valid JSON. Nothing was imported.', 'error'); return; }
    if (!isObj(raw) || !['sources', 'favorites', 'notes', 'resume'].some(k => k in raw)) { toast('That doesn\'t look like a jukebox export. Nothing was imported.', 'error'); return; }
    storageSet(BACKUP_KEY, JSON.stringify(lib));
    const inc = normalizeLibrary({ ...raw, settings: {} });
    let shows = 0, recs = 0;
    for (const [id, list] of Object.entries(inc.sources)) {
      const cur = lib.sources[id] || [];
      const add = list.filter(s => !cur.some(c => c.videoId === s.videoId)).map(s => ({ ...s, primary: false }));
      if (add.length) { if (!cur.length) shows++; recs += add.length; lib.sources[id] = cur.concat(add); ensureOnePrimary(lib.sources[id]); }
    }
    for (const [id, t] of Object.entries(inc.favorites)) if (!lib.favorites[id]) lib.favorites[id] = t;
    for (const [id, n] of Object.entries(inc.notes)) if (!lib.notes[id]) lib.notes[id] = n;
    for (const [k, r] of Object.entries(inc.resume)) if (!lib.resume[k] || lib.resume[k].at < r.at) lib.resume[k] = r;
    Object.assign(lib.deadLinks, inc.deadLinks); Object.assign(lib.auto.rejected, inc.auto.rejected);
    for (const [q, t] of Object.entries(inc.auto.queries)) lib.auto.queries[q] = Math.max(lib.auto.queries[q] || 0, t);
    saveLibrary(); refresh();
    toast(`Imported ${recs} record${recs === 1 ? '' : 's'} (${shows} newly loaded show${shows === 1 ? '' : 's'}), plus stars, notes and listening spots. The previous library was backed up first.`, 'info', 8000);
  };
  reader.onerror = () => toast('Couldn\'t read that file.', 'error');
  reader.readAsText(file);
}

    const sel = $(`#um-${CSS.escape(el.dataset.vid)}`), ep = EP_BY_ID.get(sel && sel.value);
    if (!ep) { toast('Pick the show first.', 'error'); return; }
    const u = unmatched.find(x => x.v.id === el.dataset.vid);
    attachVideos(ep, [u.v], { force: true });
    unmatched = unmatched.filter(x => x !== u); refresh(); toast(`Loaded onto ${esc(epLabel(ep))}.`);
  },
  'um-skip': el => { lib.auto.rejected[el.dataset.vid] = true; saveLibrary(); unmatched = unmatched.filter(x => x.v.id !== el.dataset.vid); renderPanel(); },
  'check-links': () => checkLinks(),
  'clear-dead': () => { lib.deadLinks = {}; saveLibrary(); refresh(); toast('Dead-link flags cleared.'); },
  'export': () => exportLibrary(),
  'import': () => $('#import-file').click(),
  'clear-resume': () => { lib.resume = {}; saveLibrary(); refresh(); toast('Listening spots forgotten.'); },
  'show-file-help': () => { renderFileBanner(true); closeModal(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  'hide-file-help': () => { try { sessionStorage.setItem('ttrh.fileBanner', 'min'); } catch { /* ignore */ } renderFileBanner(); },
  'copy-cmd': () => {
    const inp = $('#file-cmd'), done = () => toast('Copied. Paste it into the window and press Return.');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(inp.value).then(done, () => { inp.select(); document.execCommand('copy'); done(); });
    else { inp.select(); document.execCommand('copy'); done(); }
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  if (el.tagName !== 'A' || el.dataset.action) e.preventDefault();
  e.stopPropagation();
  if (el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  try { fn(el, e); } catch (err) { console.error(err); toast('Something went wrong: ' + esc(err.message), 'error'); }
}, true);

/* dial: click or drag to seek; chapter dots jump to their song */
(function wireDial() {
  const dial = $('#dial');
  const pctAt = x => { const r = $('.dial-scale', dial).getBoundingClientRect(); return Math.min(1, Math.max(0, (x - r.left) / r.width)); };
  const tAt = x => Math.min(P.duration, pctAt(x) * (+dial.dataset.mins || 60) * 60);
  dial.addEventListener('pointerdown', e => {
    if (!P.duration) return;
    const dot = e.target.closest('.ch');
    if (dot) { seekTo(+dot.dataset.t); return; }
    P.seeking = true; dial.setPointerCapture(e.pointerId);
    const move = ev => { const n = $('#needle'); if (n) n.style.left = (pctAt(ev.clientX) * 100) + '%'; $('#dial-now').textContent = fmtTime(tAt(ev.clientX)); };
    move(e);
    const up = ev => { dial.removeEventListener('pointermove', move); dial.removeEventListener('pointerup', up); P.seeking = false; seekTo(tAt(ev.clientX)); };
    dial.addEventListener('pointermove', move); dial.addEventListener('pointerup', up);
  });
  dial.addEventListener('keydown', e => {
    if (!P.duration) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); seekTo(Math.min(P.duration, P.time + 30)); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); seekTo(Math.max(0, P.time - 30)); }
  });
})();

/* keyboard: type a code (B 1 4 Enter), space to play/pause */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === 'Escape') {
    if ($('#modal-root').classList.contains('open')) closeModal();
    else if ($('#drawer').classList.contains('open')) $('#drawer').classList.remove('open');
    else if (P.big) setBig(false);
    else if (entry.letter) kpClear();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('#modal-root').classList.contains('open')) return;
  const k = e.key.toUpperCase();
  if (['A', 'B', 'C', 'D'].includes(k)) { e.preventDefault(); kpLetter(k); return; }
  if (/^[0-9]$/.test(k) && entry.letter) { e.preventDefault(); kpDigit(k); return; }
  if (e.key === 'Enter' && entry.letter) { e.preventDefault(); kpSelect(false); return; }
  if (e.key === 'Backspace' && entry.letter) { e.preventDefault(); if (entry.digits) entry.digits = entry.digits.slice(0, -1); else entry.letter = ''; renderKeypad(); renderReadout(); return; }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('strip')) { ACTIONS.strip(e.target); return; }
  if (e.key === ' ' && !/^(BUTTON|A)$/.test(e.target.tagName)) { e.preventDefault(); togglePlay(); }
});
window.addEventListener('beforeunload', () => savePosition(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) savePosition(true); });
window.addEventListener('resize', debounce(renderMinibar, 150));

/* ---------------------------------------------------------------------
   16. Boot
   --------------------------------------------------------------------- */
if (session.index >= 0 && currentItem()) $('#vp-idle').innerHTML = `<b>${esc(currentEp().code)} · ${esc(currentEp().title)}</b><span>Press Play to pick up where you left off.</span>`;
renderKeypad();
renderPlayer();
renderQueue();
renderRack();
renderFileBanner();
maybeAutoRun();
</script>
